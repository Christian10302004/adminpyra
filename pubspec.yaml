name: pyrafullapp
description: "PyraCheck Fire Safety Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.3
  firebase_auth: ^5.5.0
  firebase_storage: ^12.4.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  crypto: ^3.0.3
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  file_picker: ^8.1.6
  fl_chart: ^0.70.2
  pdf: ^3.11.1
  printing: ^5.13.4
  sqflite: ^2.4.1
  signature: ^5.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/